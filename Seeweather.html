<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="Seeweather.css" />
</head>
<body>
  <div class="container">
    <h1>Weather Dashboard</h1>
    <input type="text" id="cityInput" placeholder="Enter a Nigerian city (e.g. Lagos, Abuja)" />
    <button onclick="getWeather()">Search</button>

    <div id="currentWeather" class="weather-box"></div>

    <h2>5-Day Forecast</h2>
    <div id="forecast" class="forecast-box"></div>
  </div>

  <script src="Seeweather.js"></script>
</body>
</html>
